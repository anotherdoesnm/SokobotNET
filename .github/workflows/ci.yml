name: ci

on:
  push:
    branches: [ master, friend-review ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: build the bot
        run: dotnet build SokobotNET.csproj -c Release --nologo

      - name: run the game logic tests
        run: dotnet test SokobotNET.Tests/SokobotNET.Tests.csproj -c Release --nologo
